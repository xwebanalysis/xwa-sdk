[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xwa-sdk"
version = "0.2.1"
description = "Shared data schemas and API contracts for the XWA ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
# Proprietary — All rights reserved. See the repository LICENSE file for the
# full terms. This package is not open source and is not intended for
# redistribution outside the XWA ecosystem.
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/xwebanalysis/xwa-sdk"
Documentation = "https://github.com/xwebanalysis/xwa-sdk/tree/main/docs"

[tool.setuptools]
packages = ["xwa_sdk"]

[tool.setuptools.package-data]
xwa_sdk = ["py.typed", "schemas/*.json", "schemas/items/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run the suite from the source tree without an editable install.
pythonpath = ["."]
